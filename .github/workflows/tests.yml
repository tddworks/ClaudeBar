name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# A newer push to the same branch or PR replaces this run, so a queued or
# running one is cancelled instead of waiting for a scarce macOS runner.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit Tests with Coverage
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Get Swift version
        run: swift --version

      # Cache the dependency checkouts (Tuist/.build, ~3 min cold for
      # aws-sdk-swift) — but not DerivedData. Every warm run that restored
      # build.yml's .derivedData failed before a test ran: "Unable to resolve
      # module dependency: '_SubprocessCShims' (in target 'SwiftTerm')" —
      # compiled modules from another checkout. Tests build from a clean
      # DerivedData; build.yml keeps its cache, which it builds with fine.
      - name: Cache Tuist dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/Library/Caches/tuist
            Tuist/.build
          key: tuist-v1-${{ runner.os }}-${{ hashFiles('Tuist/Package.swift', 'Tuist.swift', 'App/Project.swift', 'Workspace.swift', 'Package.swift') }}
          restore-keys: |
            tuist-v1-${{ runner.os }}-

      # `brew update` first: the runner image's Homebrew metadata is as old as
      # the image, and `Tuist/Package.swift` needs Tuist 4.209 or later (AGENTS.md).
      - name: Install Tuist
        run: |
          brew update --quiet
          brew install --cask tuist
          tuist version

      - name: Install Dependencies
        run: tuist install

      - name: Generate Project
        run: |
          tuist generate --no-open
          ./scripts/fix-swiftterm-metal.sh

      - name: Run Tests with Coverage
        run: |
          xcodebuild test \
            -scheme ClaudeBar \
            -workspace ClaudeBar.xcworkspace \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath .derivedData \
            -enableCodeCoverage YES \
            -skipMacroValidation \
            -resultBundlePath TestResults.xcresult

      # Codecov counts covered lines from lcov's DA records, so the report
      # needs every line's count, not each function's totals (those uploads
      # processed to 0 files). Only our own code: the dependencies
      # (Tuist/.build) and build products are instrumented too.
      - name: Generate Coverage Report
        run: |
          python3 << 'EOF'
          import json, os, subprocess, sys

          root = os.getcwd() + '/'
          bundle = 'TestResults.xcresult'

          def xccov(*args):
              return subprocess.run(['xcrun', 'xccov', 'view', '--archive', *args, bundle],
                                    check=True, capture_output=True, text=True).stdout

          def ours(path):
              if not path.startswith(root):
                  return False
              rel = path[len(root):]
              if rel.startswith(('Tuist/', '.derivedData/', 'Derived/')) or '/Derived/' in rel:
                  return False
              if '/Tests/' in rel or rel.startswith('Tests/') or 'Preview' in rel:
                  return False
              if rel.startswith('Sources/App/') or '/Infrastructure/Adapters/' in rel:
                  return False
              return rel.endswith('.swift')

          files = [p for p in xccov('--file-list').splitlines() if ours(p.strip())]
          written = covered = total = 0
          with open('coverage.lcov', 'w') as lcov:
              for path in files:
                  report = json.loads(xccov('--json', '--file', path))
                  lines = report.get(path) if isinstance(report, dict) else None
                  if lines is None and isinstance(report, dict) and len(report) == 1:
                      lines = next(iter(report.values()))
                  lines = [l for l in (lines or []) if l.get('isExecutable')]
                  if not lines:
                      continue
                  lcov.write(f"SF:{path[len(root):]}\n")
                  hit = 0
                  for l in lines:
                      count = l.get('executionCount') or 0
                      lcov.write(f"DA:{l['line']},{count}\n")
                      hit += count > 0
                  lcov.write(f"LF:{len(lines)}\nLH:{hit}\nend_of_record\n")
                  written += 1; covered += hit; total += len(lines)

          print(f"coverage.lcov: {written} files, {covered}/{total} lines")
          if written == 0:
              sys.exit("No coverage lines found for our own sources")
          EOF

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: coverage.lcov
          disable_search: true
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
