name: Windows

# MODULAR_DESIGN §10 (one package, two platforms): the modules build and pass
# their tests on Windows with the same Swift as the Mac, so a day of logs
# counts the same on both. A test that needs what Windows lacks yet is
# skipped there, saying why (§10, "The shape").

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# It runs a third-party setup action and the tests; neither writes anything.
permissions:
  contents: read

jobs:
  kit:
    name: ClaudeBarKit on Windows
    runs-on: windows-latest
    steps:
      # The same Swift as the macOS jobs' Xcode, so a difference is Windows'.
      - name: Install Swift
        uses: compnerd/gha-setup-swift@main
        with:
          swift-version: swift-6.3.3-release
          swift-build: 6.3.3-RELEASE

      - name: Checkout
        uses: actions/checkout@v4

      - name: Get Swift version
        run: swift --version

      # The root Package.swift declares, on Windows, what builds there today:
      # Quotas, Diagnostics, DataSources, Providers, Leaderboard and Monitoring, and their tests.
      - name: Build and test
        run: swift test

      # The person's time zone (#565). The runner is in UTC, which is also
      # what Foundation's own lookup answers on Windows, so the port's
      # contract runs again in a zone with daylight saving and in one without.
      - name: Time zone contract in Pacific and Korea time
        run: |
          foreach ($zone in 'Pacific Standard Time', 'Korea Standard Time') {
            tzutil /s $zone
            swift test --skip-build --filter TimeZoneContract
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
