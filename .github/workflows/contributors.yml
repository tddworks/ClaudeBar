name: Sync Contributors

# Anyone whose code reached main is added to .all-contributorsrc for "code",
# then the README table and the landing-page grid are rendered from it.
# Other contribution types still come from the all-contributors bot: comment
# "@all-contributors please add @user for doc" on an issue or PR.

on:
  push:
    branches: [main]
  # GitHub's contributor list can lag a merge; the daily run catches up.
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-contributors
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Add new code contributors
        env:
          PRIVATE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # `check` prints the GitHub contributors missing from .all-contributorsrc
          # on its second line, comma-separated; bots are not contributors.
          MISSING=$(npx -y all-contributors-cli@6 check | sed -n '2p' | tr ',' '\n' | tr -d ' ' \
            | grep -v -E '\[bot\]$|^Copilot$' || true)
          for login in $MISSING; do
            echo "Adding $login"
            npx -y all-contributors-cli@6 add "$login" code
          done
          npx -y all-contributors-cli@6 generate

      - name: Render landing-page grid
        run: python3 scripts/sync-contributors.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- .all-contributorsrc README.md docs/index.html; then
            echo "Contributors already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .all-contributorsrc README.md docs/index.html
          git commit -m "docs: sync contributors [skip ci]"
          git push
          # A push with GITHUB_TOKEN starts no workflows, so deploy the site here
          gh workflow run deploy-pages.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
