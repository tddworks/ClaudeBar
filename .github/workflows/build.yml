name: Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# A newer push to the same branch or PR replaces this run, so a queued or
# running one is cancelled instead of waiting for a scarce macOS runner.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Verify
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # No explicit Swift toolchain setup: use the runner's bundled Xcode, the
      # same toolchain Tuist builds its macro prebuilts (SwiftSyntax) against.
      # Installing a separate toolchain via SwiftyLab/setup-swift drifted out of
      # sync with those prebuilts and broke the Release build ("SwiftSyntax was
      # created for incompatible target"). Mirrors the passing tests.yml.

      # Cold runs re-fetch every external dependency into Tuist/.build (the
      # aws-sdk-swift checkout alone takes ~3 min), recompile the project
      # manifests, and rebuild all externals in DerivedData for each
      # configuration. Cache all three so a run only builds what changed.
      # Keys hash the dependency manifests; bump the `v1` suffix by hand to
      # discard a poisoned cache. tests.yml uses the same keys and shares
      # these caches.
      - name: Cache Tuist dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/Library/Caches/tuist
            Tuist/.build
          key: tuist-v1-${{ runner.os }}-${{ hashFiles('Tuist/Package.swift', 'Tuist.swift', 'App/Project.swift', 'Workspace.swift', 'Package.swift') }}
          restore-keys: |
            tuist-v1-${{ runner.os }}-

      - name: Cache DerivedData
        uses: actions/cache@v5
        with:
          path: .derivedData
          key: derived-data-v1-${{ runner.os }}-${{ hashFiles('Tuist/Package.swift', 'Tuist.swift', 'App/Project.swift', 'Workspace.swift', 'Package.swift') }}
          restore-keys: |
            derived-data-v1-${{ runner.os }}-

      # `brew update` first: the runner image's Homebrew metadata is as old as
      # the image, and `Tuist/Package.swift` needs Tuist 4.209 or later (AGENTS.md).
      - name: Install Tuist
        run: |
          brew update --quiet
          brew install --cask tuist
          tuist version

      - name: Install Dependencies
        run: tuist install

      - name: Generate Project
        run: |
          tuist generate --no-open
          ./scripts/fix-swiftterm-metal.sh

      - name: Build Debug
        run: xcodebuild build -scheme ClaudeBar -workspace ClaudeBar.xcworkspace -destination 'platform=macOS,arch=arm64' -derivedDataPath .derivedData

      - name: Build Release
        run: xcodebuild build -scheme ClaudeBar -workspace ClaudeBar.xcworkspace -destination 'platform=macOS,arch=arm64' -configuration Release -derivedDataPath .derivedData
