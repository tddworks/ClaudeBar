name: Docs

# Checks docs against docs/documentation-design/README.md#enforcement.
# Fails on any problem, including a stale generated docs/README.md.

on:
  pull_request:
    paths:
      - '**.md'
      - 'scripts/check-docs.py'
      - 'scripts/gen-docs.py'
      - 'scripts/*changelog*'
      - 'Modules/Providers/Resources/Providers/**'
      - '.github/workflows/docs.yml'
  push:
    branches: [main]
    paths:
      - '**.md'
      - 'scripts/check-docs.py'
      - 'scripts/gen-docs.py'
      - 'scripts/*changelog*'
      - 'Modules/Providers/Resources/Providers/**'

permissions:
  contents: read

jobs:
  check-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check docs
        run: python3 scripts/check-docs.py --strict
      # A release must keep [Unreleased] + the current minor, and lose nothing.
      - name: Changelog release scripts
        run: scripts/test-changelog-release.sh
