name: Deploy Pages

# Publishes docs/ (the landing page) to GitHub Pages whenever it changes on main.
#
# Previously the site only deployed as a step inside release.yml, so any landing
# page edit sat unpublished until the next release.
#
# IMPORTANT — docs/appcast.xml:
# The appcast is generated by release.yml inside the runner and uploaded to Pages,
# but never committed back. The copy tracked in git is therefore stale (it still
# reads 0.2.2). Publishing it would point every user's Sparkle updater at an old
# version, so this workflow replaces it with whatever is currently live before
# deploying, and refuses to deploy if that fetch fails.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never race release.yml's own Pages deployment.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Preserve the live appcast
        run: |
          LIVE="https://tddworks.github.io/ClaudeBar/appcast.xml"

          if ! curl -fsSL --retry 3 --retry-delay 2 "$LIVE" -o /tmp/appcast.xml; then
            echo "::error::Could not fetch the live appcast from $LIVE."
            echo "::error::Refusing to deploy — publishing the repo copy would roll back Sparkle auto-updates."
            exit 1
          fi

          if ! grep -q '<rss' /tmp/appcast.xml; then
            echo "::error::Fetched appcast is not valid RSS. Refusing to deploy."
            exit 1
          fi

          REPO_VERSION=$(grep -o '<sparkle:shortVersionString>[^<]*' docs/appcast.xml | head -1 | cut -d'>' -f2)
          LIVE_VERSION=$(grep -o '<sparkle:shortVersionString>[^<]*' /tmp/appcast.xml | head -1 | cut -d'>' -f2)
          echo "repo appcast: ${REPO_VERSION:-unknown} → publishing live appcast: ${LIVE_VERSION:-unknown}"

          cp /tmp/appcast.xml docs/appcast.xml

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4
