coverage:
  status:
    project:
      default:
        target: 80%
        threshold: 2%
    patch:
      default:
        target: 70%

comment:
  layout: "reach,diff,flags,tree"
  behavior: default
  require_changes: false

ignore:
  - "Tests/**/*"
  - "Sources/App/Views/**/*"  # UI code - harder to test
  - "Sources/Infrastructure/Adapters/**/*"  # Pure adapters for 3rd party CLI/APIs
  - "**/*Preview*.swift"  # SwiftUI previews
  # Thin wrappers whose only job is I/O or a system call. Tests stand in for
  # each through its port, so a test of the real one would test macOS or the SDK.
  - "Modules/AWSClients/Sources/**/*"  # AWS SDK
  - "Modules/Diagnostics/Sources/Internal/macOS/OSLogSink.swift"  # OSLog
  - "Modules/DataSources/Sources/Internal/macOS/Platform+macOS.swift"  # hands out the system workers below
  - "Modules/DataSources/Sources/Internal/macOS/Lookup/SystemKeychain.swift"  # the security tool
  - "Modules/DataSources/Sources/Internal/macOS/Process/ProcessRPCTransport.swift"  # stdio pipe
  - "Modules/DataSources/Sources/Internal/macOS/Process/RunningProcesses.swift"  # ps
  - "Modules/DataSources/Sources/Internal/macOS/Process/DefaultCLIExecutor.swift"  # Process
  - "Modules/DataSources/Sources/Internal/macOS/Process/PipeCLIExecutor.swift"  # Process
  - "Modules/DataSources/Sources/Internal/Process/FoundationSignInProcess.swift"  # Process
  - "Modules/DataSources/Sources/Internal/Network/URLSessionNetworkClient.swift"  # URLSession
  - "Modules/DataSources/Sources/Internal/macOS/Network/MacLocalServers.swift"  # URLSession, pgrep, lsof
  - "Modules/DataSources/Sources/Internal/Windows/Network/WindowsLocalServers.swift"  # WinHTTP, the kernel's tables
  - "Modules/DataSources/Sources/Internal/macOS/Lookup/SystemBrowserCookies.swift"  # browser cookie stores
  - "Modules/DataSources/Sources/Internal/macOS/Lookup/SystemBrowserStorage.swift"  # browser profiles
  - "Modules/Leaderboard/Sources/Internal/macOS/Platform+macOS.swift"  # hands out the key store and machine below
  - "Modules/Leaderboard/Sources/Internal/macOS/KeychainSigningKeyStore.swift"  # Keychain
  - "Modules/Leaderboard/Sources/Internal/macOS/IOKitMachineIdentity.swift"  # IOKit; MacModel names what it reads
  - "Sources/Infrastructure/Activity/Hooks/HookHTTPServer.swift"  # a local socket server
  - "Sources/Infrastructure/Alerting/LocalAPI/LocalAPIServer.swift"  # a local socket server; its framing is LocalAPIRequestFrame's, tested
  - "Sources/Infrastructure/Alerting/SystemAlertSender.swift"  # NSAlert, notifications
  - "Sources/Infrastructure/Monitoring/SystemPowerStateProvider.swift"  # IOKit
  - "Sources/Infrastructure/Monitoring/SystemClock.swift"  # the clock
  - "Sources/Infrastructure/DataSources/SimpleCLIExecutor.swift"  # Process
  - "Sources/Infrastructure/Activity/Notch/NSScreen+NotchMetrics.swift"  # NSScreen
  - "Sources/Infrastructure/Settings/Storage/KeychainCredentialRepository.swift"  # Keychain
